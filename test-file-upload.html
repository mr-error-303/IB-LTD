<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test File Upload</title>
</head>
<body>
    <h1>Test File Upload Functionality</h1>
    <form id="testForm">
        <div>
            <label>Full Name:</label>
            <input type="text" name="fullName" value="John Doe" required>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" name="email" value="john.doe@example.com" required>
        </div>
        <div>
            <label>Phone:</label>
            <input type="tel" name="phone" value="1234567890" required>
        </div>
        <div>
            <label>Address:</label>
            <input type="text" name="address" value="123 Main St" required>
        </div>
        <div>
            <label>Date of Birth:</label>
            <input type="date" name="dateOfBirth" value="1990-01-01" required>
        </div>
        <div>
            <label>National ID:</label>
            <input type="text" name="nationalId" value="ID123456789" required>
        </div>
        <div>
            <label>Username:</label>
            <input type="text" name="username" value="johndoe" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" value="SecurePass123!" required>
        </div>
        <div>
            <label>Security Question:</label>
            <select name="securityQuestion" required>
                <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
            </select>
        </div>
        <div>
            <label>Security Answer:</label>
            <input type="text" name="securityAnswer" value="Smith" required>
        </div>
        <div>
            <label>Profile Photo:</label>
            <input type="file" name="profilePhoto" accept="image/*">
        </div>
        <div>
            <label>NID Front Photo:</label>
            <input type="file" name="nidFrontPhoto" accept="image/*">
        </div>
        <div>
            <label>NID Back Photo:</label>
            <input type="file" name="nidBackPhoto" accept="image/*">
        </div>
        <div>
            <input type="checkbox" name="agreeToTerms" checked required>
            <label>I agree to the terms and conditions</label>
        </div>
        <button type="submit">Register</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const form = e.target;
            
            // Add all form fields to FormData
            for (let element of form.elements) {
                if (element.name && element.type !== 'submit') {
                    if (element.type === 'file') {
                        if (element.files[0]) {
                            formData.append(element.name, element.files[0]);
                        }
                    } else if (element.type === 'checkbox') {
                        formData.append(element.name, element.checked);
                    } else {
                        formData.append(element.name, element.value);
                    }
                }
            }
            
            try {
                const response = await fetch('http://localhost:5001/api/auth/register', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.text();
                document.getElementById('result').innerHTML = `
                    <h3>Response Status: ${response.status}</h3>
                    <pre>${result}</pre>
                `;
                
                console.log('Response:', result);
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
