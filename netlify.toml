[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/build"
  functions = "netlify/functions"
  base = "."

[build.environment]
  REACT_APP_API_URL = "https://international-bank-limited.netlify.app/api"
  GENERATE_SOURCEMAP = "false"
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Build processing settings
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# CSP for main app
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://international-bank-limited.netlify.app"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Admin Panel Backend Functions
[[redirects]]
  from = "/admin-api/*"
  to = "/.netlify/functions/admin-api/:splat"
  status = 200
  force = true

# Main API redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA redirects (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200