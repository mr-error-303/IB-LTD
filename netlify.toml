[build]
  command = "cd customer-portal && npm run build"
  publish = "customer-portal/build"
  functions = "netlify/functions"

[build.environment]
  REACT_APP_API_URL = "https://international-bank-limited.netlify.app/api"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200